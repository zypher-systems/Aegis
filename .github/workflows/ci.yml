name: CI

# Pushes and pull requests run the checks, build the api, proxy, and web
# images, and exercise them with the happy-path. A push to main publishes
# linux/amd64 and linux/arm64 to GHCR. Tags follow VERSION (1.8.0, 1.8,
# latest) plus sha-<commit>. The firewall bouncer is not published.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Vet and test
        run: |
          go vet ./...
          go test ./...
          go install github.com/bufbuild/buf/cmd/buf@v1.47.2
          buf lint
          sh tests/coverage-floor.sh
      - name: Dashboard types
        working-directory: web
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit

  images:
    name: Images (${{ matrix.arch }})
    needs: check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        id: build
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          month=$(date -u +%Y-%m)
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          prefix="ghcr.io/${owner}"
          for spec in "api|deploy/Dockerfile.api" "proxy|deploy/Dockerfile.proxy" "web|deploy/Dockerfile.web"; do
            name=${spec%%|*}
            file=${spec#*|}
            args=(--build-arg "AEGIS_VERSION=${version}")
            if [ "$name" != web ]; then
              args+=(--build-arg "GEOIP_MONTH=${month}")
            fi
            docker buildx build \
              --platform "$PLATFORM" \
              --load \
              --file "$file" \
              --tag "${prefix}/aegis-${name}:${version}" \
              --tag "${prefix}/aegis-${name}:latest" \
              --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.licenses=MIT" \
              --label "org.opencontainers.image.version=${version}" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --cache-from "type=gha,scope=aegis-${name}-${ARCH}" \
              --cache-to "type=gha,mode=max,scope=aegis-${name}-${ARCH}" \
              "${args[@]}" \
              .
          done
          {
            echo "version=${version}"
            echo "prefix=${prefix}"
          } >> "$GITHUB_OUTPUT"

      - name: Scan api
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.build.outputs.prefix }}/aegis-api:${{ steps.build.outputs.version }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
          timeout: 10m
      - name: Scan proxy
        if: always() && steps.build.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.build.outputs.prefix }}/aegis-proxy:${{ steps.build.outputs.version }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
          timeout: 10m
      - name: Scan web
        if: always() && steps.build.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.build.outputs.prefix }}/aegis-web:${{ steps.build.outputs.version }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
          timeout: 10m

      - name: Stack env
        env:
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          set -euo pipefail
          umask 077
          cat > .env <<EOF
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          AEGIS_SECRET_KEY=$(openssl rand -base64 32)
          AEGIS_ENROLL_TOKEN=$(openssl rand -hex 24)
          CROWDSEC_BOUNCER_KEY=$(openssl rand -hex 32)
          CROWDSEC_FIREWALL_KEY=$(openssl rand -hex 32)
          CROWDSEC_MACHINE_PASSWORD=$(openssl rand -hex 32)
          AEGIS_SELFSIGNED=true
          AEGIS_PULL_POLICY=never
          GEOIP_MONTH=$(date -u +%Y-%m)
          EOF

      - name: Start the stack
        id: stack
        run: docker compose -f compose.yaml -f compose.ci.yaml up -d --wait --wait-timeout 420

      - name: Happy path
        run: |
          set -euo pipefail
          cid=$(docker compose -f compose.yaml -f compose.ci.yaml ps -q api)
          net=$(docker inspect "$cid" --format '{{range $n, $_ := .NetworkSettings.Networks}}{{$n}}{{end}}')
          docker run --rm --network "$net" \
            -v "$PWD/tests/e2e/happy-path.sh:/happy-path.sh:ro" \
            -e API=http://api:8080 \
            -e EDGE_HTTP=http://proxy:80 \
            -e EDGE_HTTPS=https://proxy:443 \
            -e AEGIS_E2E_ORIGIN=http://api:8080 \
            debian:bookworm-slim \
            bash -lc 'export DEBIAN_FRONTEND=noninteractive; apt-get update -qq && apt-get install -y -qq curl openssl ca-certificates python3 >/dev/null && bash /happy-path.sh'

      - name: Logs
        if: failure() && steps.stack.outcome != 'skipped'
        run: docker compose -f compose.yaml -f compose.ci.yaml logs

      - name: Tear down
        if: always() && steps.stack.outcome != 'skipped'
        run: docker compose -f compose.yaml -f compose.ci.yaml down -v

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish this architecture
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.build.outputs.version }}
          PREFIX: ${{ steps.build.outputs.prefix }}
        run: |
          set -euo pipefail
          short=${GITHUB_SHA::7}
          for name in api proxy web; do
            src="${PREFIX}/aegis-${name}:${VERSION}"
            dest="${PREFIX}/aegis-${name}:sha-${short}-${ARCH}"
            docker tag "$src" "$dest"
            docker push "$dest"
          done

  publish:
    name: Publish
    needs: images
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Multi-arch tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          minor=${version%.*}
          short=${GITHUB_SHA::7}
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          for name in api proxy web; do
            image="ghcr.io/${owner}/aegis-${name}"
            docker buildx imagetools create \
              --tag "${image}:${version}" \
              --tag "${image}:${minor}" \
              --tag "${image}:latest" \
              --tag "${image}:sha-${short}" \
              "${image}:sha-${short}-amd64" \
              "${image}:sha-${short}-arm64"
            docker buildx imagetools inspect "${image}:${version}" | tee "/tmp/${name}.inspect"
            grep -q 'linux/amd64' "/tmp/${name}.inspect"
            grep -q 'linux/arm64' "/tmp/${name}.inspect"
          done
          for name in api proxy web; do
            api="orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/aegis-${name}"
            vis=""
            for _ in 1 2 3 4 5 6; do
              vis=$(gh api "$api" --jq .visibility 2>/dev/null || true)
              [ -n "$vis" ] && break
              sleep 5
            done
            echo "aegis-${name} visibility: ${vis:-missing}"
            if [ "$vis" != "public" ]; then
              gh api --method PATCH "$api" -f visibility=public
              vis=$(gh api "$api" --jq .visibility)
            fi
            [ "$vis" = "public" ]
          done
