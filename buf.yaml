version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # Streaming RPCs carry domain messages (ConfigUpdate, TelemetryEvent),
    # not request/response pairs, so the unary naming rules don't apply.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - FILE
