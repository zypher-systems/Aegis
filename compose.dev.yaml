# Hot-reload overlay. Use with the base stack:
#   docker compose -f compose.yaml -f compose.dev.yaml up --build
#
# Go services run from the bind-mounted tree via the tools image.
# The dashboard runs `next dev`. No host Go/Node install.
# Distroless healthcheck binaries are not in PATH here, so probes are `true`;
# production compose.yaml hits /aegis-api and /aegis-proxy.
services:
  api:
    image: aegis-tools:dev
    build:
      context: .
      dockerfile: deploy/Dockerfile.tools
    working_dir: /workspace
    user: root
    command: ["go", "run", "./services/api/cmd/aegis-api"]
    healthcheck:
      test: ["CMD", "true"]
      interval: 5s
      timeout: 2s
      retries: 1
      start_period: 15s
    volumes:
      - .:/workspace
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build

  proxy:
    image: aegis-tools:dev
    build:
      context: .
      dockerfile: deploy/Dockerfile.tools
    working_dir: /workspace
    user: root
    command: ["go", "run", "./services/proxy/cmd/aegis-proxy"]
    healthcheck:
      test: ["CMD", "true"]
      interval: 5s
      timeout: 2s
      retries: 1
      start_period: 15s
    volumes:
      - .:/workspace
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
      - proxystate:/var/lib/aegis-proxy
      - aegis-logs:/var/log/aegis

  web:
    image: node:22-bookworm
    working_dir: /web
    command: ["sh", "-lc", "corepack enable && pnpm install && pnpm dev --hostname 0.0.0.0 --port 3000"]
    environment:
      AEGIS_API_INTERNAL: http://api:8080
      PORT: "3000"
    healthcheck:
      test: ["CMD", "true"]
      interval: 5s
      timeout: 2s
      retries: 1
      start_period: 20s
    volumes:
      - ./web:/web
      - pnpm-store:/root/.local/share/pnpm/store
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3300}:3000"

volumes:
  go-mod-cache:
  go-build-cache:
  pnpm-store:
