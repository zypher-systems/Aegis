syntax = "proto3";

package aegis.v1;

option go_package = "github.com/zypher-systems/aegis/gen/aegis/v1;aegisv1";

// EnrollmentService turns a one-time enrollment token into an mTLS identity
// for a data-plane node. This is the only RPC reachable without a client cert.
service EnrollmentService {
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
}

message EnrollRequest {
  // One-time token generated by the control plane (env or UI).
  string token = 1;
  // PEM-encoded PKCS#10 certificate signing request.
  bytes csr_pem = 2;
  // Human-readable node name shown in the dashboard.
  string node_name = 3;
  // Data-plane software version, e.g. "0.1.0".
  string agent_version = 4;
}

message EnrollResponse {
  // Node identifier assigned by the control plane.
  string node_id = 1;
  // Signed client certificate (PEM) for mTLS.
  bytes certificate_pem = 2;
  // Control-plane CA certificate (PEM) to pin as the trust root.
  bytes ca_certificate_pem = 3;
}
